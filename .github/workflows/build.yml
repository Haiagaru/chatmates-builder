name: Build ChatMate's

on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      channel:
        description: Haiagaru release channel
        type: choice
        options: [all, stable, prerelease]
        default: all
      force:
        description: Rebuild already published bundles
        type: boolean
        default: false

concurrency:
  group: chatmates-builds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.title == '更新' || github.event.issue.body == '更新')) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request && github.event.comment.body == '更新')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      has_updates: ${{ steps.plan.outputs.has_updates }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      release_matrix: ${{ steps.plan.outputs.release_matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Detect releases and local issue update requests
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'all' }}
          FORCE: ${{ inputs.force || false }}
        run: python scripts/builder.py discover --channel "$CHANNEL"

  build:
    name: ChMate ${{ matrix.apk_id }} / Haiagaru ${{ matrix.release.upstream_tag }} (${{ matrix.release.channel }})
    needs: discover
    if: needs.discover.outputs.has_updates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build four Shizuku and MEGA combinations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON: ${{ toJSON(matrix.release) }}
          APK_ID: ${{ matrix.apk_id }}
          CHATMATES_KEYSTORE_BASE64: ${{ secrets.CHATMATES_KEYSTORE_BASE64 }}
          CHATMATES_KEYSTORE_PASSWORD: ${{ secrets.CHATMATES_KEYSTORE_PASSWORD }}
        run: python scripts/builder.py build --apk-id "$APK_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.release.key }}-${{ matrix.apk_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: logs-${{ matrix.release.key }}-${{ matrix.apk_id }}
          path: logs/*
          retention-days: 7

  publish:
    name: Publish Haiagaru ${{ matrix.release.upstream_tag }} (${{ matrix.release.channel }})
    needs: [discover, build]
    if: needs.discover.outputs.has_updates == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.release_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: apk-${{ matrix.release.key }}-*
          path: out
          merge-multiple: true
      - name: Check all APKs and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON: ${{ toJSON(matrix.release) }}
        run: python scripts/builder.py publish
